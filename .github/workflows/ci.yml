# Modified for Canopy.
# Builds and tests Canopy. PRs run Linux only, the cheapest runner; pushes to
# main and manual runs (Actions tab > ci > Run workflow) add macOS and Windows.
name: ci

on:
  pull_request:
    paths-ignore: ["site/**", ".github/workflows/pages.yml"]
  push:
    branches: [main]
    paths-ignore: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR or branch cancels its older run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: 1.95.0
  ZIG_VERSION: 0.16.0
  BUN_VERSION: 1.4.4
  # CI builds each commit once, so incremental state only bloats the cache.
  CARGO_INCREMENTAL: "0"
  UNOPTIMIZED: 'profile.dev.package."*".opt-level=0'

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-22.04"]') || fromJSON('["ubuntu-22.04", "macos-15", "windows-2022"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      # The Zig cache is not kept: ghostty's build output lives in target/.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false

      - name: Linux packages
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          scripts/ci-apt pkg-config clang libclang-dev \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev mesa-vulkan-drivers libfontconfig-dev libfreetype-dev
      - name: Windows libclang
        if: runner.os == 'Windows'
        run: echo "LIBCLANG_PATH=C:/Program Files/LLVM/bin" >> "$GITHUB_ENV"

      # The whole target/, so vendored crates (gpui, ghostty) are cached too.
      # The key changes only with dependencies (and .gitattributes, which
      # ci-sources answers with a full build), so a source-only push restores
      # an exact hit and saves nothing. Any run may save on a miss: a PR then
      # reuses its own cache, as GitHub scopes PR caches to that PR.
      - name: Restore build cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: &cache-paths |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: build-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-zig${{ env.ZIG_VERSION }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'vendor/**', 'crates/**', '.gitattributes') }}
          restore-keys: build-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-zig${{ env.ZIG_VERSION }}-
      # Checkout makes every file new; this marks unchanged ones old so Cargo
      # keeps their cached build.
      - run: scripts/ci-sources restore
      # Unoptimized dependencies: a cold build takes minutes less.
      - name: Build tests
        run: cargo test --locked --config "$UNOPTIMIZED" --no-run
      # Saved before the tests run, so a failing test still leaves a warm cache.
      - name: Save build cache
        if: steps.cache.outputs.cache-hit != 'true'
        run: scripts/ci-sources record
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *cache-paths
          key: ${{ steps.cache.outputs.cache-primary-key }}

      # Linux renders the screenshot test with headless Vulkan. macOS and
      # Windows skip it here: macOS runs it on a real window below, and
      # Windows runners have no desktop.
      - name: Tests
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            cargo test --locked --config "$UNOPTIMIZED" -- --test-threads 4
          else
            only=(--bins)
            for t in tests/*.rs; do
              name=$(basename "$t" .rs)
              [ "$name" = shot_pixels ] || only+=(--test "$name")
            done
            cargo test --locked --config "$UNOPTIMIZED" "${only[@]}"
          fi
      - name: Screenshot pixels
        if: runner.os == 'macOS'
        timeout-minutes: 5
        env:
          CANOPY_SHOT_NATIVE_TEST: "1"
        run: cargo test --locked --config "$UNOPTIMIZED" --test shot_pixels

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: runner.os == 'Linux'
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Mod and script tests
        if: runner.os == 'Linux'
        run: bun test scripts/
      - name: Docs match the app
        if: runner.os == 'Linux'
        run: bun scripts/docs.ts check
      - name: Installer and package tests
        if: runner.os == 'Linux'
        run: python3 -I -m unittest discover -s scripts -p test_distribution.py
