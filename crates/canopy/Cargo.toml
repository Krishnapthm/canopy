[package]
name = "canopy"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
pico-args = "0.5.0"
protocol = { version = "0.1.0", path = "../protocol" }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "net", "process", "io-util", "io-std", "sync", "time", "macros", "signal"] }
ulid = "3.0.0"
